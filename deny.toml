# cargo-deny configuration
# Policy: Enforce security (advisories + sources), warn on everything else.
# License policy: Only allow permissive licenses compatible with koyomi's MIT license.
#                 Any license NOT in the allow list is automatically rejected.
#                 This implicitly blocks copyleft (GPL, AGPL, LGPL, SSPL, EUPL)
#                 and restrictive licenses (CC-BY-NC, CC-BY-SA).

[advisories]
ignore = []
unmaintained = "none"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
