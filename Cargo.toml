[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["kohdice <kohdice.biz@gmail.com>"]
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/kohdice/koyomi"

[workspace.dependencies]
# local crates
koyomi-core = { path = "./crates/koyomi-core" }

# non-local crates
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = "1.48.0"
tracing = "0.1.43"
